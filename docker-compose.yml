version: '3.8'

services:
  # Backend de autenticación
  autenticacion_service:
    build: ./autenticacion
    container_name: autenticacion_service
    mem_limit: 512m
    ports:
      - "8081:8081"
    # 👇 Usamos la directiva env_file para que lea tu archivo .env
    env_file:
      - .env
    environment:
      # Sobrescribimos la DB_URL del .env (que era Oracle) para que use la MySQL de Docker
      - DB_URL=jdbc:mysql://users_db:3306/users_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD} # Lo toma del .env
      - PORT=8081
    restart: always
    depends_on:
      users_db:
        condition: service_healthy
    networks:
      - micro_red

  # Base de Datos Local MySQL
  users_db:
    image: mysql:8.0.33
    container_name: users_db
    ports:
      - "3307:3306"
    environment:
      # Inyectamos las credenciales desde tu .env para mayor seguridad
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=users_db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    networks:
      - micro_red

  # Gateway
  gateway_service:
    build: ./gateway
    container_name: gateway_service
    mem_limit: 512m
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      # 👇 Configuramos las rutas internas de Docker Compose
      - AUTH_SERVICE_URL=http://autenticacion_service:8081
      - PRODUCTS_SERVICE_URL=http://34.203.95.0:8082
    depends_on:
      - autenticacion_service
    restart: always
    networks:
      - micro_red

networks:
  micro_red:
    driver: bridge